<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFS Argentina - Historia</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .image-container {
            position: relative;
        }

        .image-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
            padding: 0 10px;
            line-height: 1.2;
            white-space: nowrap;
        }

        .opmenu {
            color: black;
            background-color: transparent;
            border-radius: 8px;
            padding: 10px 20px;
            transition: background-color 0.3s;
        }

        .opmenu:hover {
            background-color: #FBBF24;
            color: white;
        }
    </style>
    <script>
        // Desactivar el menú contextual del botón derecho
        document.addEventListener('contextmenu', function(event) {
            event.preventDefault();
        });
    </script>
</head>
<body>
    <header>
        <div class="image-container">
            <img src="app/img/libros02.jpg" alt="libros antiguos" class="w-full h-auto">
            <h1 class="image-title block text-lg sm:text-xl md:text-2xl lg:text-3xl">Historia de la OFS en Argentina <span class="block text-sm sm:text-base md:text-lg lg:text-xl">Desde la recepción de la Regla paulina</span></h1>
        </div>
    
        <nav class="bg-yellow-500">
            <div class="container mx-auto px-4 py-4">
                <button id="menu-toggle" class="block md:hidden text-white">
                    ☰
                </button>
                <ul id="menu" class="hidden md:grid md:grid-cols-4 lg:grid-cols-9 gap-4 text-sm font-bold text-amber-300">
                    <li><button class="opmenu" onclick="cargarContenido('app/content/inicio.html')">Inicio</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/antecedentes.html')">Antecedentes</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/1980.html')">1980-1982</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/1983.html')">1983-1985</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/1986.html')">1986-1988</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/1989.html')">1989-1991</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/1992.html')">1992-1994</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/1995.html')">1995-1997</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/1998.html')">1998-2000</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/2001.html')">2001-2003</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/2004.html')">2004-2006</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/2007.html')">2007-2009</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/2010.html')">2010-2012</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/2013.html')">2013-2015</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/2016.html')">2016-2018</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/2019.html')">2019-2021</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/2022.html')">2022-2024</button></li>
                    <li><button class="opmenu" onclick="cargarContenido('app/content/siglas.html')">Siglas adoptadas</button></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <div id="contenido"></div>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                cargarContenido('app/content/inicio.html');

                const menuToggle = document.getElementById('menu-toggle');
                const menu = document.getElementById('menu');
                const menuItems = document.querySelectorAll('.opmenu');

                menuToggle.addEventListener('click', function() {
                    menu.classList.toggle('hidden');
                });

                menuItems.forEach(item => {
                    item.addEventListener('click', function() {
                        if (window.innerWidth < 768) { // Solo cerrar el menú en pantallas pequeñas
                            menu.classList.add('hidden');
                        }
                    });
                });
            });

            function cargarContenido(url) {
                fetch(url)
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById('contenido').innerHTML = data;
                    })
                    .catch(error => console.error('Error loading contenido:', error));
            }
        </script>
    </main>
    <footer>
        <div class="bg-yellow-500 text-center py-5">
            <p>&copy; 2025. All rights reserved.</p>
        </div>
    </footer>
    <button onclick="scrollToTop()" class="back-to-top" id="backToTopBtn" title="Ir arriba">↑</button>
    <script>
        // Función para desplazarse suavemente al principio de la página
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // Mostrar u ocultar el botón de regresar al principio según la posición del usuario
        window.addEventListener('scroll', function() {
            var backToTopButton = document.getElementById('backToTopBtn');
            if (window.scrollY > 300) {
                backToTopButton.style.display = 'block';
            } else {
                backToTopButton.style.display = 'none';
            }
        });
    </script>
</body>
</html>
